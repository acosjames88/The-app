<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' 'unsafe-eval' blob: https://sneslive.com/emulator/data/ https://www.sneslive.com/emulator/data/; connect-src https://cdn.emulatorjs.org/ https://sneslive.com/emulator/data/ https://sneslive.com/emulator/roms/ https://www.sneslive.com/emulator/data/ https://www.sneslive.com/emulator/roms/ blob:; style-src 'unsafe-inline' https://sneslive.com/emulator/data/ https://www.sneslive.com/emulator/data/; img-src data: blob: https://sneslive.com/emulator/data/ https://www.sneslive.com/emulator/data/; font-src data: https://sneslive.com/emulator/data/ https://www.sneslive.com/emulator/data/; media-src blob:; worker-src blob:; child-src blob:; frame-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>SNESLive TV Player</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font:20px sans-serif}
    #game{position:fixed;inset:0;width:100vw;height:100vh;background:#000}
    #game .ejs_parent{width:100%!important;height:100%!important}
    #game canvas{object-fit:contain;max-width:100%;max-height:100%}
  </style>
</head>
<body>
  <div id="game" aria-label="Game screen"></div>
  <script>
    __SNES_GAME_CONFIG__
    function playerDownloadFailed(){
      document.getElementById('game').textContent='Failed to download emulator. Choose Reload or Games.';
    }
  </script>
  <script src="https://sneslive.com/emulator/data/loader.js" onerror="playerDownloadFailed()"></script>
</body>
</html>
