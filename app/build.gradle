plugins { id 'com.android.application' }
android {
    namespace 'com.retrosearch.play'
    compileSdk 35
    defaultConfig {
       applicationId 'com.retrosearch.play'
       minSdk 23
       targetSdk 35
       versionCode 4
       versionName '1.3.0'
       testInstrumentationRunner 'com.retrosearch.play.SmokeInstrumentation'
    }
    compileOptions {
       sourceCompatibility JavaVersion.VERSION_17
       targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    lint { abortOnError true }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
